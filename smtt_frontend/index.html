<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;600;700&display=swap"
    rel="stylesheet">
  <!-- FontAwesome & Material Symbols for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: { blue: '#003399', light: '#1A6FD4', dark: '#0A1A40' },
            accent: { yellow: '#FFCC00', hover: '#E6B800' },
            primary: {
              DEFAULT: '#000a1e',
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            secondary: {
              DEFAULT: '#115cb9',
              500: '#eab308', // Amarelo trânsito
              600: '#ca8a04',
            },
            "surface-dim": "#d9dadb",
            "on-tertiary": "#ffffff",
            "secondary-fixed-dim": "#acc7ff",
            "tertiary": "#705d00",
            "error-container": "#ffdad6",
            "outline-variant": "#c4c6cf",
            "surface-tint": "#465f88",
            "on-background": "#191c1d",
            "outline": "#74777f",
            "primary-container": "#002147",
            "surface": "#f8f9fa",
            "error": "#ba1a1a",
            "on-secondary-fixed": "#001a40",
            "primary-fixed": "#d6e3ff",
            "on-secondary": "#ffffff",
            "on-surface": "#191c1d",
            "on-tertiary-fixed-variant": "#544600",
            "inverse-on-surface": "#f0f1f2",
            "on-surface-variant": "#44474e",
            "tertiary-fixed": "#ffe16d",
            "inverse-primary": "#aec7f6",
            "surface-container": "#edeeef",
            "on-tertiary-container": "#4c3f00",
            "surface-container-highest": "#e1e3e4",
            "secondary-container": "#659dfe",
            "tertiary-fixed-dim": "#e9c400",
            "on-primary-container": "#708ab5",
            "tertiary-container": "#c9a900",
            "secondary-fixed": "#d7e2ff",
            "surface-variant": "#e1e3e4",
            "on-secondary-container": "#003370",
            "on-secondary-fixed-variant": "#004491",
            "on-primary": "#ffffff",
            "on-primary-fixed": "#001b3d",
            "inverse-surface": "#2e3132",
            "on-primary-fixed-variant": "#2d476f",
            "on-error-container": "#93000a",
            "surface-bright": "#f8f9fa",
            "background": "#f8f9fa",
            "primary-fixed-dim": "#aec7f6",
            "surface-container-low": "#f3f4f5",
            "surface-container-lowest": "#ffffff",
            "on-tertiary-fixed": "#221b00",
            "surface-container-high": "#e7e8e9",
            "on-error": "#ffffff"
          },
          fontFamily: {
            sora: ['Sora', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: { 'soft': '0 4px 20px rgba(0,51,153,0.08)', 'hover': '0 12px 32px rgba(0,51,153,0.12)' }
        }
      }
    }
  </script>

  <style>
    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Seus estilos customizados */
    .glass-header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }

    .hero-gradient {
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.4) 100%);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes kenburns {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    .animate-kenburns {
      animation: kenburns 20s ease-in-out infinite;
    }
  </style>
  <title>SMTT - Superintendência Municipal de Transportes e Trânsito</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
