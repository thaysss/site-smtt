<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { blue: '#003399', light: '#1A6FD4', dark: '#0A1A40' },
              accent: { yellow: '#FFCC00', hover: '#E6B800' },
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                900: '#1e3a8a',
              },
              secondary: {
                500: '#eab308', // Amarelo trânsito
                600: '#ca8a04',
              }
            },
            fontFamily: { 
              sora: ['Sora', 'sans-serif'], 
              body: ['DM Sans', 'sans-serif'],
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: { 'soft': '0 4px 20px rgba(0,51,153,0.08)', 'hover': '0 12px 32px rgba(0,51,153,0.12)' }
          }
        }
      }
    </script>

    <style>
      /* Smooth scrolling */
      html {
          scroll-behavior: smooth;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
          width: 8px;
      }
      ::-webkit-scrollbar-track {
          background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
          background: #cbd5e1;
          border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
          background: #94a3b8;
      }
      /* Seus estilos customizados */
      .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
      .hero-gradient { background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%); }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <title>SMTT - Superintendência Municipal de Transportes e Trânsito</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
